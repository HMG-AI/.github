name: Organization Required Quality Gate

on:
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: organization-required-quality-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: quality-gate / commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: node:24.11.1-bookworm@sha256:9a2ed90cd91b1f3412affe080b62e69b057ba8661d9844e143a6bbd76a23260f
      options: --security-opt=no-new-privileges
    steps:
      - name: Validate commit SHA inputs
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -Eeuo pipefail
          readonly sha_pattern='^[0-9a-f]{40}$'

          for sha_name in BASE_SHA HEAD_SHA; do
            sha_value="${!sha_name}"
            if [[ ! "${sha_value}" =~ ${sha_pattern} ]]; then
              echo "::error::${sha_name} must be a full 40-character lowercase hexadecimal commit SHA"
              exit 2
            fi
          done

      - name: Check out caller repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          path: caller
          persist-credentials: false

      - name: Check out immutable organization commit policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: HMG-AI/.github
          ref: ${{ github.workflow_sha }}
          path: governance-source
          sparse-checkout: governance/commitlint
          persist-credentials: false

      - name: Install locked commitlint dependencies
        shell: bash
        working-directory: governance-source/governance/commitlint
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Lint every commit in base..head
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -Eeuo pipefail
          bash "${GITHUB_WORKSPACE}/governance-source/governance/commitlint/lint-range.sh" \
            "${GITHUB_WORKSPACE}/caller" \
            "${BASE_SHA}" \
            "${HEAD_SHA}"

  workflow-security-policy:
    name: workflow-security-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out immutable organization policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: HMG-AI/.github
          ref: ${{ github.workflow_sha }}
          path: policy-source
          persist-credentials: false

      - name: Check out exact event head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          fetch-depth: 0
          path: target-repository
          persist-credentials: false

      - name: Enforce workflow security policy on changed workflows
        shell: bash
        env:
          POLICY_SOURCE_DIR: policy-source
          TARGET_REPOSITORY_DIR: target-repository
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: bash policy-source/governance/workflow-policy/run.sh

  private-source-mirror-contract-tests:
    if: github.repository == 'HMG-AI/.github'
    name: private-source-mirror-contract-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out immutable private-mirror contract fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: HMG-AI/.github
          ref: ${{ github.workflow_sha }}
          path: governance-source
          sparse-checkout: governance/private-source-mirror
          persist-credentials: false

      - name: Check out exact governance candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          path: governance-candidate
          persist-credentials: false

      - name: Exercise immutable fixtures against the candidate verifier
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir contract-under-test
          cp \
            governance-source/governance/private-source-mirror/test_verify.py \
            contract-under-test/test_verify.py
          cp \
            governance-candidate/governance/private-source-mirror/verify.py \
            contract-under-test/verify.py
          python3 -m py_compile \
            contract-under-test/verify.py \
            contract-under-test/test_verify.py
          python3 - <<'PY'
          import sys
          import unittest

          suite = unittest.defaultTestLoader.discover(
              "contract-under-test",
              pattern="test_*.py",
          )
          count = suite.countTestCases()
          if count != 19:
              raise SystemExit(f"expected 19 immutable contract tests, discovered {count}")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() else 1)
          PY

  private-source-mirror-provenance:
    if: github.repository == 'HMG-AI/HMG-DEV-brach'
    name: private-source-mirror-provenance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Reject unsupported private-mirror events
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          echo "::error::The private exact-source mirror currently accepts pull_request events only"
          exit 2

      - name: Check out immutable private-mirror policy
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: HMG-AI/.github
          ref: ${{ github.workflow_sha }}
          path: governance-source
          sparse-checkout: governance/private-source-mirror
          persist-credentials: false

      - name: Check out exact private-mirror event head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: target-repository
          persist-credentials: false

      - name: Exercise private-mirror contract fixtures
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover \
            -s governance-source/governance/private-source-mirror \
            -p 'test_*.py'

      - name: Verify signed exact-source provenance and tree equality
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TARGET_BASE_REF: ${{ github.event.pull_request.base.ref }}
          TARGET_REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -Eeuo pipefail
          python3 governance-source/governance/private-source-mirror/verify.py \
            --target-repository-dir target-repository \
            --target-sha "${TARGET_SHA}" \
            --target-base-sha "${TARGET_BASE_SHA}" \
            --event-name "${EVENT_NAME}" \
            --target-repository "${TARGET_REPOSITORY}" \
            --target-base-ref "${TARGET_BASE_REF}" \
            --trusted-public-key \
              governance-source/governance/private-source-mirror/keys/ed25519-spki-sha256-6d20ed9a744fd0b6cd2d75bfc5bb8a4468c8f7b0071aa96b0e3524f0b177508b.pem
